# XcodeGen — projeto iOS gerado a partir deste YAML (texto, git-friendly, sem
# .xcodeproj binário no diff). Regenera com `make generate` ou `xcodegen generate`.
# O app é uma casca fina: TODA a lógica vive no pacote AtlasCore (SPM) linkado
# aqui. É o alvo com.vitor.atlas.native do plano parallel-native-rebuild —
# coexiste com o RN (com.vitor.atlas) até o cutover.
name: Atlas
options:
  bundleIdPrefix: com.vitor
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"

packages:
  AtlasCore:
    path: ..

settings:
  base:
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: "W28WF9A5A2"   # Vitor Freire (conta PAGA) — perfil wildcard já inclui o iPhone

targets:
  Atlas:
    type: application
    platform: iOS
    sources:
      - path: Atlas
    configFiles:
      Debug: Atlas/Config.xcconfig
      Release: Atlas/Config.xcconfig
    dependencies:
      - package: AtlasCore
        product: AtlasCore
      - package: AtlasCore
        product: AtlasImaging
      - target: AtlasWidgets
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.vitor.atlas.native
        CODE_SIGN_ENTITLEMENTS: Atlas/Atlas.entitlements
        INFOPLIST_FILE: Atlas/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
        # Conversation Supremacy é validada/desenhada para iPhone. Declarar
        # iPad sem layouts/rotações provados gerava warning físico e uma
        # promessa falsa; o target iPad nasce quando sua vertical existir.
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_STRICT_CONCURRENCY: complete
        CODE_SIGN_STYLE: Automatic
      configs:
        Debug:
          APS_ENVIRONMENT: development
        Release:
          APS_ENVIRONMENT: production

  AtlasWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: Widgets
      - path: Atlas/AtlasActivityAttributes.swift
      - path: Atlas/AtlasTurnAttributes+ContentState.swift
    dependencies:
      - package: AtlasCore
        product: AtlasCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.vitor.atlas.native.widgets
        CODE_SIGN_ENTITLEMENTS: Widgets/AtlasWidgets.entitlements
        INFOPLIST_FILE: Widgets/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        SWIFT_STRICT_CONCURRENCY: complete
        CODE_SIGN_STYLE: Automatic
        SKIP_INSTALL: YES
        TARGETED_DEVICE_FAMILY: "1"

  AtlasDeviceProof:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
      # Mesmas constantes que a casca — XCUITest não pode divergir em silêncio.
      # A família inteira (base + peels A11yID+*.swift), senão os IDs peelados
      # somem do target de teste e a bateria para de compilar.
      - path: Atlas
        includes:
          - "A11yID*.swift"
    dependencies:
      - target: Atlas
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.vitor.atlas.native.deviceproof
        TEST_TARGET_NAME: Atlas
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_STRICT_CONCURRENCY: complete
        CODE_SIGN_STYLE: Automatic
