# XcodeGen — projeto iOS gerado a partir deste YAML (texto, git-friendly, sem
# .xcodeproj binário no diff). Regenera com `make generate` ou `xcodegen generate`.
# O app é uma casca fina: TODA a lógica vive no pacote AtlasCore (SPM) linkado
# aqui. É o alvo com.vitor.atlas.native do plano parallel-native-rebuild —
# coexiste com o RN (com.vitor.atlas) até o cutover.
name: Atlas
options:
  bundleIdPrefix: com.vitor
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"

packages:
  AtlasCore:
    path: ..

settings:
  base:
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ""   # preenchido no 1º open do Xcode (assinatura automática)

targets:
  Atlas:
    type: application
    platform: iOS
    sources:
      - path: Atlas
    configFiles:
      Debug: Atlas/Config.xcconfig
      Release: Atlas/Config.xcconfig
    dependencies:
      - package: AtlasCore
        product: AtlasCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.vitor.atlas.native
        INFOPLIST_FILE: Atlas/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
